{% extends "base.html" %}

{% block title %}
Login - JanSahayak AI
{% endblock %}

{% block content %}

<div class="auth-container">


<div class="auth-card">


    <!-- Login Icon -->

    <div class="auth-icon">
        🔐
    </div>


    <h1>
        Welcome Back
    </h1>


    <p>
        Login to your JanSahayak account.
    </p>


    <!-- ========================= -->
    <!-- LOGIN FORM -->
    <!-- ========================= -->

    <form method="POST">

        {% csrf_token %}


        <!-- EMAIL -->

        <div class="form-group">

            <label for="email">
                Email
            </label>

            <input
                id="email"
                type="email"
                name="email"
                required
                autocomplete="email"
                placeholder="Enter your registered email"
            >

        </div>


        <!-- PASSWORD -->

        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                id="password"
                type="password"
                name="password"
                required
                autocomplete="current-password"
                placeholder="Enter password"
            >

        </div>


        <!-- SUBMIT BUTTON -->

        <button
            type="submit"
            class="btn primary full">

            Login

        </button>

    </form>


    <!-- REGISTER LINK -->

    <p class="auth-footer">

        Don't have an account?

        <a href="{% url 'register' %}">
            Register
        </a>

    </p>


</div>


</div>

{% endblock %}
